name: Code Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.34.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production and development dependencies
        run: pnpm audit

      - name: Run Biome lint & format check
        run: pnpm run lint

      - name: Run TypeScript type checking
        run: pnpm run typecheck

      - name: Run Test with Coverage
        run: pnpm run test:coverage

      - name: Build public archive without database credentials
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_WEB_URL: https://mishima-preview.example.com

      - name: Check public pages in production mode
        run: |
          pnpm --filter web start --port 3002 --hostname 127.0.0.1 > /tmp/mishima-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3002/ > /dev/null; then break; fi
            sleep 1
          done
          pnpm test:public

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        with:
          files: ./web/coverage/coverage-final.json
          token: ${{ secrets.CODECOV_TOKEN }}
